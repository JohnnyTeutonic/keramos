# keramos CI: the tests, the validator over the stored corpus, and the conformance suite against the numpy
# reference (IR_SPEC section 11). CPU only; a few minutes. Expected values are not regenerated here: they
# come from the reference environment alone (IR_SPEC 4.6, requirements-reference.txt).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two tests rebuild committed fixtures and compare their f32 bits, so the run pins the reference
    # environment's numpy (requirements-reference.txt) and its BLAS: one thread, and OpenBLAS's Haswell
    # kernels whatever the runner's CPU (an AVX-512 runner otherwise picks other kernels, whose sums
    # can differ in the last bit).
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, so the results file records the tag, describe and tree (IR_SPEC 2.6)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # the reference environment's CPython minor version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-reference.txt
      - name: Install
        run: python -m pip install -r requirements.txt -c requirements-reference.txt
      - name: Environment
        run: |
          python -c "import sys, numpy; print(sys.version); print('numpy', numpy.__version__)"
          python -c "import numpy; numpy.show_config()"
      - name: Tests
        run: python -m pytest tests -q
      - name: Validator over the corpus
        run: python tools/ir_validate.py --corpus --quiet
      - name: Conformance suite against the numpy reference
        run: python tools/ir_conformance.py --adapter ir_numpy --json conformance-ir_numpy.json
      - name: Results file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-ir_numpy
          path: conformance-ir_numpy.json
          if-no-files-found: ignore
